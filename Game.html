<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gunah Chess - Battle</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/king.css">
    <link rel="stylesheet" href="css/queen.css">
    <link rel="stylesheet" href="css/bishop.css">
    <link rel="stylesheet" href="css/rook.css">
    <link rel="stylesheet" href="css/knight.css">
    <link rel="stylesheet" href="css/pawn.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="game-body">

    <div id="game-layout">
        <div class="board-area">
            <div class="player-bar top">
                <span class="player-name" id="bot-name-display">BOT (1500 ELO)</span>
                <div class="captured-pieces" id="black-captured"></div>
            </div>

            <div class="board-wrapper">
                <div id="board"></div>
            </div>

            <div class="player-bar bottom">
                <span class="player-name" id="player-name-display">YOU</span>
                <div class="captured-pieces" id="white-captured"></div>
            </div>
        </div>

        <div class="side-panel">
            <div class="status-bar" id="game-status">Your turn</div>
            <div class="move-history">
                <div class="history-header">Move History</div>
                <div class="history-list" id="move-history-list"></div>
            </div>
            <div class="controls">
                <button id="btn-new-game" class="btn-red">Restart</button>
                <a href="index.html" class="btn-outline">Quit to Menu</a>
            </div>
        </div>
    </div>

    <div id="promotion-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Choose your Mutation</h3>
            <div class="promotion-options" id="promotion-options"></div>
        </div>
    </div>

    <!-- Load Bot Engine First -->
    <script src="js/bot.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
